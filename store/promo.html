<!doctype html>
<!-- Store promo tiles. Rendered at 440x280 (?size=small) and 1400x560 (?size=marquee); see store/listing.md. -->
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <title>Kombina promo</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f5f6f8;
        color: #1f2429;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .tile { display: flex; align-items: center; width: 100%; height: 100%; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand img { border-radius: 22%; box-shadow: 0 6px 18px rgba(217, 119, 43, 0.35); }
      .name { font-weight: 800; letter-spacing: -0.02em; }
      .tag { color: #646b73; line-height: 1.3; }
      .tag b { color: #d9772b; }
      .pill {
        display: inline-block; margin-top: 14px; padding: 4px 12px; border-radius: 999px;
        background: #e2f3ea; color: #2e8b61; font-weight: 700;
      }

      /* small 440x280 */
      .small .tile { padding: 0 34px; }
      .small .brand img { width: 72px; height: 72px; }
      .small .name { font-size: 46px; }
      .small .tag { font-size: 17px; margin-top: 14px; max-width: 360px; }
      .small .pill { font-size: 13px; }
      .small .shot { display: none; }

      /* marquee 1400x560 */
      .marquee .tile { padding: 0 90px; gap: 70px; }
      .marquee .text { flex: 0 0 470px; }
      .marquee .brand img { width: 104px; height: 104px; }
      .marquee .name { font-size: 76px; }
      .marquee .tag { font-size: 28px; margin-top: 22px; }
      .marquee .pill { font-size: 18px; margin-top: 22px; }
      .marquee .shot {
        flex: 1; height: 440px; border-radius: 16px; overflow: hidden;
        box-shadow: 0 20px 50px rgba(31, 36, 41, 0.18); border: 1px solid #dde1e6;
        background: #fff url('images/pt-1-compare.png') left top / 860px auto no-repeat;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="text">
        <div class="brand"><img src="../icons/icon-128.png" alt="" /><span class="name">Kombina</span></div>
        <p class="tag">A loja <b>mais barata</b> para a tua lista inteira, com portes incluídos.</p>
        <span class="pill">portes grátis · alternativas · 2 lojas</span>
      </div>
      <div class="shot"></div>
    </div>
    <script>
      document.body.className = new URLSearchParams(location.search).get('size') === 'marquee' ? 'marquee' : 'small';
    </script>
  </body>
</html>
