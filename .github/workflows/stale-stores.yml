# Once a month, opens (or updates) an issue listing the stores whose shipping rules in
# data/stores.json haven't been checked for 90 days, so the data gets refreshed.
name: Stale shipping data

on:
  schedule:
    - cron: '0 8 1 * *' # 08:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find stale stores
        id: stale
        run: |
          if node scripts/stale-stores.mjs 90 --markdown > report.md; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          cat report.md

      - name: Open or update the issue
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create stale-shipping --color FBCA04 --description "Shipping data to re-check" --force
          existing=$(gh issue list --label stale-shipping --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "Re-check shipping data" --label stale-shipping --body-file report.md
          fi
